name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The build container is debian:trixie, the oldest distribution carrying
  # GTK 4.18 / libadwaita 1.7, which relm4's gnome_48 feature requires. That
  # sets the glibc floor at 2.41 and keeps the binary usable on Debian 13+,
  # Ubuntu 25.04+, Fedora 42+, and Arch. `container:` cannot read a workflow
  # env value, so raising the floor means editing both job containers and this.
  GLIBC_MAX: '2.41'

jobs:
  helpers:
    name: Static helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl \
            -p v2ray-rs-netctl -p v2ray-rs-run
      - name: Assert static
        run: |
          # A NEEDED entry is the only definitive proof of a runtime dependency.
          # musl produces static-pie, which `ldd` reports as "statically linked"
          # rather than "not a dynamic executable", so match on neither string.
          for bin in v2ray-rs-netctl v2ray-rs-run; do
            path="target/x86_64-unknown-linux-musl/release/$bin"
            file "$path"
            if readelf -d "$path" | grep -q 'NEEDED'; then
              echo "::error::$bin links shared libraries"
              readelf -d "$path"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: helpers
          path: |
            target/x86_64-unknown-linux-musl/release/v2ray-rs-netctl
            target/x86_64-unknown-linux-musl/release/v2ray-rs-run
          if-no-files-found: error

  tarball:
    name: Tarball
    needs: helpers
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkgconf libgtk-4-dev libadwaita-1-dev \
            libglib2.0-dev-bin gettext protobuf-compiler \
            binutils ca-certificates curl file git
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: helpers
          path: helpers
      - name: Build GUI
        run: cargo build --release --locked -p v2ray-rs-ui
      - name: Assert glibc floor
        run: |
          # Without pipefail the pipeline's status is tail's, always 0, so a
          # failed objdump would leave max empty -- and an empty max sorts below
          # the limit, passing the very check it exists to fail.
          set -o pipefail
          max=$(objdump -T target/release/v2ray-rs-ui \
            | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          if [ -z "$max" ]; then
            echo "::error::read no GLIBC symbols from the binary; cannot verify the floor"
            exit 1
          fi
          echo "highest glibc symbol: $max (limit ${GLIBC_MAX})"
          if [ "$(printf '%s\n%s\n' "$max" "$GLIBC_MAX" | sort -V | tail -1)" != "$GLIBC_MAX" ]; then
            echo "::error::binary requires glibc $max, above the ${GLIBC_MAX} floor"
            exit 1
          fi
      - name: Metadata
        id: meta
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Stage and pack
        run: |
          chmod +x helpers/v2ray-rs-netctl helpers/v2ray-rs-run
          scripts/stage-dist.sh \
            --version "${{ steps.meta.outputs.version }}" \
            --ui target/release/v2ray-rs-ui \
            --netctl helpers/v2ray-rs-netctl \
            --run helpers/v2ray-rs-run \
            --out dist
          tar -C dist -czf "v2ray-rs-x86_64-linux.tar.gz" \
            "v2ray-rs-${{ steps.meta.outputs.version }}-x86_64-linux"
          sha256sum -b v2ray-rs-x86_64-linux.tar.gz >v2ray-rs-x86_64-linux.tar.gz.sha256
      - name: Generate installer
        run: |
          scripts/gen-installer.sh "${{ steps.meta.outputs.version }}" \
            v2ray-rs-x86_64-linux.tar.gz install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: |
            v2ray-rs-x86_64-linux.tar.gz
            v2ray-rs-x86_64-linux.tar.gz.sha256
            install.sh
          if-no-files-found: error

  appimage:
    name: AppImage
    needs: tarball
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            pkgconf libgtk-4-dev libadwaita-1-dev libglib2.0-dev-bin \
            librsvg2-common adwaita-icon-theme libgdk-pixbuf2.0-bin \
            desktop-file-utils ca-certificates curl file binutils \
            fuse3 libfuse2t64 xvfb \
            dpkg-dev
      - uses: actions/download-artifact@v4
        with:
          name: tarball
      - name: Fetch linuxdeploy
        run: |
          base=https://github.com/linuxdeploy/linuxdeploy
          curl -fsSLo /usr/local/bin/linuxdeploy \
            "$base/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSLo /usr/local/bin/linuxdeploy-plugin-gtk \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x /usr/local/bin/linuxdeploy /usr/local/bin/linuxdeploy-plugin-gtk
      - name: Stage AppDir
        run: |
          mkdir -p AppDir/usr
          tar xzf v2ray-rs-x86_64-linux.tar.gz --strip-components 1 -C AppDir/usr
          # The setuid wrapper resolves the v2ray-rs-bypass system user, which no
          # AppImage flow creates, so shipping it would only add attack surface.
          rm -f AppDir/usr/bin/v2ray-rs-run
          rm -f AppDir/usr/LICENSE AppDir/usr/README.md
          test ! -e AppDir/usr/bin/v2ray-rs-run
      - name: Build AppImage
        env:
          DEPLOY_GTK_VERSION: '4'
          # linuxdeploy is itself an AppImage and cannot mount FUSE in a container.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          OUTPUT: v2ray-rs-x86_64.AppImage
        run: |
          linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/v2ray-rs \
            --desktop-file AppDir/usr/share/applications/com.github.v2ray-rs.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/com.github.v2ray-rs.svg \
            --plugin gtk \
            --output appimage
          sha256sum -b v2ray-rs-x86_64.AppImage >v2ray-rs-x86_64.AppImage.sha256
      - name: Smoke test
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          # --help exits before GTK init, but the loader has already resolved
          # every bundled library by then, so this is the link check.
          ./v2ray-rs-x86_64.AppImage --help
          # Only a real window exercises pixbuf loaders, GSettings schemas, and
          # the icon theme, which is where GTK4 bundling actually breaks.
          status=0
          xvfb-run --auto-servernum timeout 20 ./v2ray-rs-x86_64.AppImage \
            --profile development || status=$?
          # 124 is timeout expiring on a healthy long-running window.
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "::error::AppImage exited with $status under Xvfb"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            v2ray-rs-x86_64.AppImage
            v2ray-rs-x86_64.AppImage.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [tarball, appimage]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: assets
      - name: Collect PKGBUILDs
        run: |
          cp pkg/archlinux/PKGBUILD assets/PKGBUILD
          cp pkg/archlinux/bin/PKGBUILD assets/PKGBUILD-bin
          # Both recipes declare install=v2ray-rs.install; without it a
          # downloaded PKGBUILD cannot be built.
          cp pkg/archlinux/v2ray-rs.install assets/v2ray-rs.install
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: assets/*

  aur:
    name: Publish to AUR
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/aur-publish.yml
    secrets: inherit
