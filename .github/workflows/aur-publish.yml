name: AUR Publish

on:
  workflow_call:
  workflow_dispatch:

jobs:
  aur:
    name: Publish to AUR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: v2ray-rs
          pkgbuild: pkg/archlinux/PKGBUILD
          assets: |
            pkg/archlinux/v2ray-rs.install
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          updpkgsums: true
          # `assets` makes the action `git add --all`, and updpkgsums downloads
          # the source tarball into the repo dir (which exceeds AUR's blob-size
          # limit). Remove the tarball after checksums are computed but before the
          # commit, so the real sha256sums stay in the PKGBUILD without the tarball
          # being published.
          post_process: rm -f ./*.tar.gz
