name: AUR Publish

on:
  workflow_call:
  workflow_dispatch:

jobs:
  aur:
    name: Publish to AUR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: v2ray-rs
          pkgbuild: pkg/archlinux/PKGBUILD
          assets: |
            pkg/archlinux/v2ray-rs.install
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          # Keep off: `assets` makes the action `git add --all`, which would sweep
          # the tarball updpkgsums downloads into the AUR repo (exceeds its blob
          # limit). `sha256sums=('SKIP')` is correct for GitHub archive sources.
          updpkgsums: false
