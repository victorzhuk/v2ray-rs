name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check --all

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm base-devel pkgconf gtk4 libadwaita gettext protobuf
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Compile gated privileged tests
        run: cargo check --workspace --all-targets --features v2ray-rs-process/privileged-tests,v2ray-rs-netctl/privileged-tests

  test:
    name: Test
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm base-devel pkgconf gtk4 libadwaita gettext protobuf curl
      - name: Install sing-box
        run: |
          ver=1.13.14
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${ver}/sing-box-${ver}-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 "sing-box-${ver}-linux-amd64/sing-box"
          sing-box version
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
      - name: Create non-root builder user
        run: |
          useradd -m -s /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE" /github/home
      - name: Test
        run: |
          su builder -c 'export PATH="$CARGO_HOME/bin:$PATH" HOME=/github/home CARGO_TERM_COLOR=always; cd "$GITHUB_WORKSPACE" && cargo test --workspace --all-targets'

  audit:
    name: Advisory audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install cargo-audit
        env:
          CARGO_AUDIT_VERSION: v0.22.2
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/RustSec/cargo-audit/releases/download/cargo-audit%2F${CARGO_AUDIT_VERSION}/cargo-audit-x86_64-unknown-linux-gnu-${CARGO_AUDIT_VERSION}.tgz" \
            | tar -xz -C /usr/local/bin --strip-components=1 \
                "cargo-audit-x86_64-unknown-linux-gnu-${CARGO_AUDIT_VERSION}/cargo-audit"
          cargo-audit --version
      # Policy: fail the build only on vulnerability advisories in the resolved
      # Cargo.lock. Unmaintained/yanked-crate warnings are reported without failing.
      - name: Run cargo audit
        run: |
          cargo audit --file Cargo.lock
