name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check --all

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm base-devel pkgconf gtk4 libadwaita gettext protobuf
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Compile gated privileged tests
        run: cargo check --workspace --all-targets --features v2ray-rs-process/privileged-tests,v2ray-rs-netctl/privileged-tests

  test:
    name: Test
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm base-devel pkgconf gtk4 libadwaita gettext protobuf curl unzip xorg-server-xvfb xorg-xauth dbus gzip sed
          echo 'ru_RU.UTF-8 UTF-8' >>/etc/locale.gen
          locale-gen
          locale -a | grep -qi '^ru_RU.utf8$' || { echo '::error::ru_RU.UTF-8 locale was not generated'; locale -a; exit 1; }
      - name: Install pinned proxy backends
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 \
            -H 'Accept: application/octet-stream' \
            https://api.github.com/repos/SagerNet/sing-box/releases/assets/457461733 \
            -o sing-box.tar.gz
          echo 'f48703461a15476951ac4967cdad339d986f4b8096b4eb3ff0829a500502d697  sing-box.tar.gz' | sha256sum -c -
          tar -xzf sing-box.tar.gz -C /usr/local/bin --strip-components=1 sing-box-1.13.14-linux-amd64/sing-box
          curl --fail --location --retry 3 --max-time 120 \
            -H 'Accept: application/octet-stream' \
            https://api.github.com/repos/XTLS/Xray-core/releases/assets/726356726 \
            -o xray.zip
          echo 'b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82  xray.zip' | sha256sum -c -
          unzip -p xray.zip xray > /usr/local/bin/xray
          chmod 0755 /usr/local/bin/xray
          curl --fail --location --retry 3 --max-time 120 \
            -H 'Accept: application/octet-stream' \
            https://api.github.com/repos/v2fly/v2ray-core/releases/assets/499340613 \
            -o v2ray.zip
          echo '6bbb8aee65a57d0b12599b4b7c842b3ad0daca4436e661d94015c447cb31b4fa  v2ray.zip' | sha256sum -c -
          unzip -p v2ray.zip v2ray > /usr/local/bin/v2ray
          chmod 0755 /usr/local/bin/v2ray
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/v2fly/geoip/releases/download/202611080027/geoip.dat \
            -o /usr/local/bin/geoip.dat
          echo 'eedb24b3b9fcba27e06b92c0428dab90d9496083091ae4cf39e11387fd99d0e2  /usr/local/bin/geoip.dat' | sha256sum -c -
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/v2fly/domain-list-community/releases/download/20261118141523/dlc.dat \
            -o /usr/local/bin/geosite.dat
          echo 'a033da583af17f15c9743f0b29aa5c073e9c1b8018a99ab4e69bc9ed5248a086  /usr/local/bin/geosite.dat' | sha256sum -c -
          sing-box version
          xray version
          v2ray version
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
      - name: Test release installers
        run: make test-installers
      - name: Create non-root builder user
        run: |
          useradd -m -s /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE" /github/home
      - name: Test
        run: |
          su builder -s /bin/bash <<'TEST'
          set -e
          export PATH="$CARGO_HOME/bin:$PATH" HOME=/github/home CARGO_TERM_COLOR=always
          cd "$GITHUB_WORKSPACE"
          V2RAY_RS_REQUIRE_BACKENDS=1 V2RAY_RS_REQUIRE_DISPLAY=1 xvfb-run -a dbus-run-session -- make test CARGO_FLAGS="--locked -j 2 --no-fail-fast" TEST_TIMEOUT=10m TEST_THREADS=2
          TEST

  routing-acceptance:
    name: Isolated routing acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
      - name: Prepare routing prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler iproute2
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -rn true
          sudo modprobe tun
          test -c /dev/net/tun
          curl --fail --location --retry 3 --max-time 120 \
            -H 'Accept: application/octet-stream' \
            https://api.github.com/repos/SagerNet/sing-box/releases/assets/457461733 \
            -o sing-box.tar.gz
          echo 'f48703461a15476951ac4967cdad339d986f4b8096b4eb3ff0829a500502d697  sing-box.tar.gz' | sha256sum -c -
          tar -xzf sing-box.tar.gz sing-box-1.13.14-linux-amd64/sing-box
          sudo install -m 0755 sing-box-1.13.14-linux-amd64/sing-box /usr/bin/sing-box
      - name: Verify sing-box routing in private namespaces
        run: make test-process CARGO_FLAGS='--locked -j 2 --features privileged-tests --test singbox_routing' TEST_TIMEOUT=6m TEST_THREADS=1
      - name: Verify route helper in disposable namespaces
        run: |
          timeout 3m cargo test --locked -j 2 -p v2ray-rs-netctl --features privileged-tests --bin v2ray-rs-netctl --test privileged --no-run --message-format=json > routing-artifacts.jsonl
          python3 - <<'PYTHON'
          import json
          import subprocess
          from pathlib import Path
          binaries = {entry["target"]["name"]: entry["executable"]
                      for line in Path("routing-artifacts.jsonl").read_text().splitlines()
                      if (entry := json.loads(line)).get("reason") == "compiler-artifact"
                      and entry.get("profile", {}).get("test") and entry.get("executable")}
          if set(binaries) != {"privileged", "v2ray-rs-netctl"}:
              raise SystemExit("expected the helper unit and privileged test executables")
          native = binaries["v2ray-rs-netctl"]
          listing = subprocess.run([native, "--list"], capture_output=True, text=True, check=True, timeout=10)
          scenario = "net::tests::journaled_route_mutations_in_private_namespace"
          if scenario + ": test" not in listing.stdout:
              raise SystemExit("required journal scenario is missing")
          subprocess.run(["sudo", "timeout", "2m", native, "--exact", scenario, "--test-threads=1"],
                         check=True, timeout=130)
          subprocess.run(["sudo", "env", "V2RAY_RS_REQUIRE_NETNS=1", "timeout", "3m", binaries["privileged"],
                          "--test-threads=1"], check=True, timeout=190)
          PYTHON

  audit:
    name: Advisory audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install cargo-audit
        env:
          CARGO_AUDIT_VERSION: v0.22.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 \
            -H 'Accept: application/octet-stream' \
            https://api.github.com/repos/RustSec/cargo-audit/releases/assets/439291614 \
            -o cargo-audit.tgz
          echo 'ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39  cargo-audit.tgz' | sha256sum -c -
          tar -xzf cargo-audit.tgz -C /usr/local/bin --strip-components=1 \
            "cargo-audit-x86_64-unknown-linux-gnu-${CARGO_AUDIT_VERSION}/cargo-audit"
          cargo-audit --version
      # Policy: fail the build only on vulnerability advisories in the resolved
      # Cargo.lock. Unmaintained/yanked-crate warnings are reported without failing.
      - name: Run cargo audit
        run: |
          cargo audit --file Cargo.lock
