[package]
name = "v2ray-rs-ui"
version.workspace = true
edition.workspace = true

[dependencies]
v2ray-rs-core.workspace = true
v2ray-rs-process.workspace = true
v2ray-rs-subscription.workspace = true
v2ray-rs-tray.workspace = true
relm4.workspace = true
tokio.workspace = true
log.workspace = true
uuid.workspace = true
chrono.workspace = true
gettext-rs.workspace = true
ipnet.workspace = true
rustls.workspace = true
clap.workspace = true

[features]
default = ["geodata-fetch"]
geodata-fetch = ["v2ray-rs-core/geodata-fetch"]

[build-dependencies]
glib-build-tools.workspace = true

[package.metadata.deb]
name = "v2ray-rs"
maintainer = "Victor Zhuk"
depends = "libgtk-4-1, libadwaita-1-0"
section = "net"
assets = [
    ["target/release/v2ray-rs-ui", "usr/bin/v2ray-rs", "755"],
    ["assets/v2ray-rs.svg", "usr/share/icons/hicolor/scalable/apps/com.github.v2ray-rs.svg", "644"],
    ["assets/v2ray-rs.png", "usr/share/icons/hicolor/256x256/apps/com.github.v2ray-rs.png", "644"],
    ["crates/ui/icons/hicolor/symbolic/apps/com.github.v2ray-rs-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/com.github.v2ray-rs-symbolic.svg", "644"],
    ["assets/com.github.v2ray-rs.desktop", "usr/share/applications/com.github.v2ray-rs.desktop", "644"],
    ["LICENSE", "usr/share/doc/v2ray-rs/copyright", "644"],
]
