[package]
name = "v2ray-rs-subscription"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Enables loopback-capable client constructors for local HTTP fixtures.
test-utils = []

[dependencies]
libc.workspace = true
v2ray-rs-core.workspace = true
v2ray-rs-process.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
ipnet.workspace = true
url.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
rustls.workspace = true
tokio.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
log.workspace = true
tempfile.workspace = true
futures.workspace = true
prost.workspace = true
tonic.workspace = true
http.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
v2ray-rs-core = { workspace = true, features = ["test-utils"] }
# Self reference so integration tests and examples can reach the
# `test-utils`-gated loopback constructors.
v2ray-rs-subscription = { path = ".", features = ["test-utils"] }
