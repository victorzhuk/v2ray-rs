syntax = "proto3";

package v2ray_geosite;

message Domain {
    enum Type {
        Plain = 0;
        Regex = 1;
        RootDomain = 2;
        Full = 3;
    }
    Type type = 1;
    string value = 2;
}

message GeoSite {
    string country_code = 1;
    repeated Domain domain = 2;
}

message GeoSiteList {
    repeated GeoSite entry = 1;
}
