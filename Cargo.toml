[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.17.3"
edition = "2024"

[profile.release]
lto = "thin"
codegen-units = 1
# `debuginfo` rather than `symbols`: it keeps .symtab, so a backtrace from a
# shipped binary still names functions. The privileged helper paths are exactly
# where a user-reported stack has to be readable.
strip = "debuginfo"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
ipnet = { version = "2", features = ["serde"] }
base64 = "0.22"
url = "2"
rand = "0.9"
reqwest = { version = "0.13", features = ["rustls-no-provider", "stream"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
nix = { version = "0.31", features = ["signal", "process", "user"] }
relm4 = { version = "0.10", features = ["gnome_48", "libadwaita"] }
gettext-rs = { version = "0.7", features = ["gettext-system"] }
resvg = "0.47"
tempfile = "3"
glib-build-tools = "0.21"
libc = "0.2"
v2ray-rs-core = { path = "crates/core" }
v2ray-rs-process = { path = "crates/process" }
v2ray-rs-subscription = { path = "crates/subscription" }
v2ray-rs-tray = { path = "crates/tray" }
ksni = "0.3"
notify-rust = "4"
percent-encoding = "2"
clap = { version = "4", features = ["derive"] }
prost = "0.13"
prost-build = "0.13"
tonic = "0.12"
http = "1"
rtnetlink = "0.21"
futures = "0.3"
